services:
  argos-dev:
    image: argos-dev-app
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - .env.dev

  argos-stage:
    image: argos-stage-app
    build:
      context: .
      dockerfile: Dockerfile.stage
    ports:
      - "8181:8181"
    env_file:
      - .env.stage

  argos-prod:
    image: argos-prod-app
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8282:8282"
    env_file:
      - .env.prod
