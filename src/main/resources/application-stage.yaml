server:
  port: '8081'

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: '${DB_STAGE_URL}'
    username: '${DB_STAGE_USERNAME}'
    password: '${DB_STAGE_PASSWORD}'

  jpa:
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_medata_access: false

    hibernate:
      ddl-auto: update

  sql:
    init:
      mode:
        never
