server:
  port: '8082'

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: '${DB_PROD_URL}'
    username: '${DB_PROD_USERNAME}'
    password: '${DB_PROD_PASSWORD}'

  jpa:
    show-sql: false

    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: never
